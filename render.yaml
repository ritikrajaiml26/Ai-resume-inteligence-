services:
  - type: web
    name: ai-resume-intelligence
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: ai-resume-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DB_ENGINE
        value: "django.db.backends.postgresql"
      - key: DEBUG
        value: "False"

databases:
  - name: ai-resume-db
    databaseName: airesume
    user: airesume_user
