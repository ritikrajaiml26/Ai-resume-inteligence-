{% extends 'base.html' %}
{% block content %}
<div class="mx-auto max-w-2xl rounded-[2rem] bg-slate-900/90 p-10 shadow-xl shadow-slate-900/30">
  <h1 class="text-3xl font-semibold text-white">Choose a new password</h1>
  <form method="post" class="mt-8 space-y-6">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div>
      {{ form.new_password1.label_tag }}
      {{ form.new_password1 }}
    </div>
    <div>
      {{ form.new_password2.label_tag }}
      {{ form.new_password2 }}
    </div>
    <button type="submit" class="rounded-full bg-indigo-500 px-6 py-3 text-white transition hover:bg-indigo-400">Reset password</button>
  </form>
</div>
{% endblock %}
