{% extends 'base.html' %}
{% block content %}
<div class="mx-auto w-full max-w-full rounded-[2rem] bg-slate-900/90 p-8 shadow-xl shadow-slate-900/30 sm:max-w-xl sm:p-10">
  <h1 class="text-3xl font-semibold text-white">Reset your password</h1>
  <p class="mt-3 text-slate-300">Enter your account email and follow the link sent to reset your password.</p>
  <form method="post" class="mt-8 space-y-6">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-slate-200">Email</label>
      {{ form.email }}
      {{ form.email.errors }}
    </div>
    <button type="submit" class="w-full rounded-full bg-indigo-500 px-6 py-3 text-white transition hover:bg-indigo-400">Send reset link</button>
  </form>
</div>
{% endblock %}
